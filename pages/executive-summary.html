    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; img-src 'self' blob: data:"

      http-equiv="X-Content-Security-Policy"

  <body class="page-scrollable-form page-executive-summary">
    <button type="button" class="btn-secondary btn-back-fixed" id="back-home">
      Back
    </button>
    <div class="setup-shell executive-summary-shell">
      <header class="setup-header">
        <h1 class="setup-title">Executive Summary</h1>
        <p class="setup-lead" id="executive-summary-context"></p>

            Property Overview

              <label for="accessibility">Accessibility Executive Summary</label>
              <button
                type="button"
                class="btn-secondary btn-ai-generate"
                data-summary-field="accessibility"
                title="Generate this section with AI from property and asset data"
              >
                Generate with AI
              </button>
            </div>
            <textarea id="accessibility" name="accessibility" rows="5"></textarea>
            <p class="field-ai-status" data-summary-status="accessibility" hidden></p>
          </div>
